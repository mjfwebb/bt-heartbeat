name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish BTHeartbeat/BTHeartbeat.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path publish/BTHeartbeat.exe -DestinationPath BTHeartbeat-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: BTHeartbeat-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
