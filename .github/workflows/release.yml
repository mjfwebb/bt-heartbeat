name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag is mutable, so `@v7`
      # silently re-points at whatever that repo tags next, and this job holds
      # `contents: write`. The trailing comment is the human-readable version; bump
      # both together, taking the SHA from the release rather than the moving major tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      # PublishAot lives in the csproj. It implies self-contained and emits a single
      # native exe, so PublishSingleFile / IncludeNativeLibrariesForSelfExtract have
      # nothing left to do here.
      - name: Publish native AOT exe
        run: >
          dotnet publish BTHeartbeat/BTHeartbeat.csproj
          -c Release
          -r win-x64
          -o publish

      - name: Report exe size
        shell: pwsh
        run: '"{0:N1} MB" -f ((Get-Item publish/BTHeartbeat.exe).Length / 1MB)'

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path publish/BTHeartbeat.exe -DestinationPath BTHeartbeat-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub release
        shell: pwsh
        run: >
          gh release create ${{ github.ref_name }}
          BTHeartbeat-${{ github.ref_name }}-win-x64.zip
          --title ${{ github.ref_name }}
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
