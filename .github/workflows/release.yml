name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish BTHeartbeat/BTHeartbeat.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Report exe size
        shell: pwsh
        run: '"{0:N1} MB" -f ((Get-Item publish/BTHeartbeat.exe).Length / 1MB)'

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path publish/BTHeartbeat.exe -DestinationPath BTHeartbeat-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub release
        shell: pwsh
        run: >
          gh release create ${{ github.ref_name }}
          BTHeartbeat-${{ github.ref_name }}-win-x64.zip
          --title ${{ github.ref_name }}
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
